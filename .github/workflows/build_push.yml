name: Build and Push Docker Image to SDC Docker Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_NAME: event-management-system
  IMAGE_NAME: checkiniq

jobs:
  build_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.sdcmuj.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            docker.sdcmuj.com/${{ env.IMAGE_NAME }}:latest
            docker.sdcmuj.com/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker.sdcmuj.com/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register full SHA
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_PLATFORM_GITHUB_PAT }}" \
            "${{ secrets.DEPLOYMENT_PLATFORM_URL }}/image-names/${{ env.PROJECT_NAME }}/${{ env.IMAGE_NAME }}/${{ github.sha }}"

      - name: Register short SHA
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_PLATFORM_GITHUB_PAT }}" \
            "${{ secrets.DEPLOYMENT_PLATFORM_URL }}/image-names/${{ env.PROJECT_NAME }}/${{ env.IMAGE_NAME }}/${{ steps.vars.outputs.short_sha }}"
